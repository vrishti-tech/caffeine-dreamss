<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Caffeine Dreams</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme1">
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="authCupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M 20 25 L 20 75 Q 20 85 30 85 L 70 85 Q 80 85 80 75 L 80 25 Z" fill="url(#authCupGradient)" stroke="#654321" stroke-width="2"/>
                <path d="M 80 40 Q 95 40 95 55 Q 95 70 80 70" fill="none" stroke="#8B4513" stroke-width="3"/>
                <path d="M 35 20 Q 35 10 40 10" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>
                <path d="M 50 18 Q 50 8 55 8" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>
                <path d="M 65 20 Q 65 10 70 10" fill="none" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <h2 id="formTitle">Login to Your Account</h2>
        <form id="authForm" onsubmit="event.preventDefault(); handleAuth();">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="name@example.com" autocomplete="email">
                <span class="error-msg" id="emailError"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
                <span class="error-msg" id="passwordError"></span>
            </div>
            <div class="form-group" id="confirmPasswordGroup" style="display:none;">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" type="password" placeholder="Repeat your password" autocomplete="new-password">
                <span class="error-msg" id="confirmError"></span>
            </div>
            <button type="submit" class="btn-auth" style="width:100%;">Continue</button>
        </form>
        <div class="toggle-text" id="toggleText">
            Don't have an account?
            <strong onclick="toggleForm()" style="cursor:pointer; color:#e74c3c;">Sign Up</strong>
        </div>
        <div class="divider">or</div>
        <button class="btn-demo" onclick="demoLogin()" style="width:100%;">Use Demo Account</button>
        <div class="toggle-text">
            <a href="index.html" class="nav-link">Back to homepage</a>
        </div>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
